<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Mis tareas</h1>

    <form id="task-form" class="task-form" autocomplete="off">
      <input id="task-input" type="text" placeholder="¿Qué hay que hacer?" aria-label="Nueva tarea" required>
      <button type="submit">Agregar</button>
    </form>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <p id="empty-msg" class="empty-msg">No hay tareas todavía.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
